# STAGING PREVIEW ONLY: keep production sweet-voice-3fdf unchanged.
name = "graphmytrade-99-shop-preview"
main = "src/worker.mjs"
compatibility_date = "2026-10-21"
workers_dev = true

[assets]
directory = "../public"
binding = "ASSETS"
# All preview requests go through the worker so X-Robots-Tag is enforced,
# including static HTML and the original homepage on workers.dev.
run_worker_first = true
not_found_handling = "404-page"

[vars]
# Once individual approved products exist, use a published PUBLIC product-only Google Sheets CSV URL here.
SHEET_CSV_URL = ""
# Switch to "true" ONLY after Instamojo payment activation and a successful
# verified buyer payment + automatic download/email delivery test.
PAYMENT_DELIVERY_VERIFIED = "false"
